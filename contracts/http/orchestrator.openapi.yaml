openapi: 3.1.0
info:
  title: Platform orchestrator (companion-facing API)
  version: 1.0.0
  description: |
    What the native companion app (and the phone-only fallback UI) calls. Domain-agnostic:
    nothing here mentions finance. The companion authenticates with a session cookie or bearer token;
    `user_ref` is always taken from the session, never trusted from the body.
    Every non-2xx response body is a `platform.error/v1` ErrorEnvelope (DEC-008); SSE streams
    end with an `event: error` carrying the same envelope if a turn fails mid-stream.
servers:
  - url: https://platform.internal.example
paths:
  /v1/sessions:
    post:
      summary: Start or resume a session after the glasses connect (or in phone-only mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, device_capabilities, locale]
              properties:
                mode: { type: string, enum: [glasses, phone_only] }
                device_capabilities:
                  type: array
                  items: { $ref: "../schemas/v1/common.schema.json#/definitions/DeviceCapability" }
                locale: { $ref: "../schemas/v1/common.schema.json#/definitions/Locale" }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                type: object
                required: [session_id, conversation_ref]
                properties:
                  session_id: { $ref: "../schemas/v1/common.schema.json#/definitions/Ref" }
                  conversation_ref: { $ref: "../schemas/v1/common.schema.json#/definitions/Ref" }
  /v1/sessions/{session_id}/device-state:
    put:
      summary: Publish the companion's latest glasses state (DEC-005)
      description: |
        Sent on every change. The server keeps the snapshot with the highest `seq` and uses it to choose
        output modality (glasses audio, phone card, display) and to refuse captures the device cannot make.
      parameters:
        - { name: session_id, in: path, required: true, schema: { $ref: "../schemas/v1/common.schema.json#/definitions/Ref" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/v1/device_session_state.schema.json" }
      responses:
        "204":
          description: Accepted (or ignored as stale because a higher `seq` is already stored)
        "422":
          description: Snapshot failed schema validation
          content:
            application/json:
              schema: { $ref: "../schemas/v1/error_envelope.schema.json" }
  /v1/consents:
    post:
      summary: Record the user's consent grant from the consent screen (ARCHITECTURE.md §2.5)
      description: |
        The companion shows the data classes and capture purposes from the capability manifest; on
        "Allow" it records the grant here and keeps the returned id for capture uploads. Every capture
        and domain request is checked against active grants (fail closed). The full `ConsentGrant`
        contract, read-only scopes and purge semantics remain proposed in DEC-014; this is the minimum
        the capture flow needs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capability_id, data_classes, purposes]
              additionalProperties: false
              properties:
                capability_id: { $ref: "../schemas/v1/common.schema.json#/definitions/CapabilityId" }
                data_classes:
                  type: array
                  minItems: 1
                  items: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
                purposes:
                  description: Capture purposes covered, e.g. price_label, receipt
                  type: array
                  items: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
      responses:
        "201":
          description: Grant recorded
          content:
            application/json:
              schema:
                type: object
                required: [consent_grant_id, capability_id, data_classes, purposes, granted_at]
                properties:
                  consent_grant_id: { $ref: "../schemas/v1/common.schema.json#/definitions/Ref" }
                  capability_id: { $ref: "../schemas/v1/common.schema.json#/definitions/CapabilityId" }
                  data_classes: { type: array, items: { type: string } }
                  purposes: { type: array, items: { type: string } }
                  granted_at: { $ref: "../schemas/v1/common.schema.json#/definitions/Timestamp" }
        "422":
          description: Unknown capability, or a data class or purpose the manifest does not declare
          content:
            application/json:
              schema: { $ref: "../schemas/v1/error_envelope.schema.json" }
  /v1/consents/{consent_grant_id}:
    delete:
      summary: Revoke a grant
      description: Captures and observations made under the grant are deleted immediately. Later uses of the id fail with `CONSENT_REVOKED`.
      parameters:
        - { name: consent_grant_id, in: path, required: true, schema: { $ref: "../schemas/v1/common.schema.json#/definitions/Ref" } }
      responses:
        "204":
          description: Revoked (idempotent)
        "404":
          description: Unknown grant
          content:
            application/json:
              schema: { $ref: "../schemas/v1/error_envelope.schema.json" }
  /v1/captures:
    post:
      summary: Upload a minimised capture (EXIF already stripped on the phone)
      description: The server stores the image ephemerally and returns the ContextCapture to attach to the next turn.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, meta]
              properties:
                image: { type: string, contentMediaType: image/jpeg }
                meta:
                  type: object
                  required: [session_id, source, trigger, purpose, minimisation, consent_grant_id, captured_at, locale]
                  properties:
                    session_id: { $ref: "../schemas/v1/common.schema.json#/definitions/Ref" }
                    source: { type: string, enum: [glasses_photo, glasses_stream_frame, phone_camera, phone_upload] }
                    trigger: { type: string, enum: [voice_command, glasses_input, phone_tap] }
                    purpose: { type: string }
                    minimisation: { type: array, items: { type: string } }
                    consent_grant_id: { $ref: "../schemas/v1/common.schema.json#/definitions/Ref" }
                    captured_at: { $ref: "../schemas/v1/common.schema.json#/definitions/Timestamp" }
                    locale: { $ref: "../schemas/v1/common.schema.json#/definitions/Locale" }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "../schemas/v1/context_capture.schema.json" }
        "403":
          description: No consent for this capture purpose (`CONSENT_REQUIRED`)
          content:
            application/json:
              schema: { $ref: "../schemas/v1/error_envelope.schema.json" }
  /v1/turns:
    post:
      summary: Send one user turn (voice, typed, or a glasses gesture)
      description: |
        Returns the composed answer as SSE, using the same DomainResponseEvent union a capability
        produces, after the platform has applied the speech budget, discreet mode and verification.
        Platform intents (confirm, cancel, repeat, show_on_phone, next_card, stop) are handled
        here without calling a capability.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/v1/voice_intent.schema.json" }
      responses:
        "200":
          description: Streamed answer
          content:
            text/event-stream:
              schema: { $ref: "../schemas/v1/domain_response_event.schema.json" }
  /v1/confirmations:
    post:
      summary: Record the user's decision on a proposal
      description: |
        The companion sends the decision and evidence from a real UI tap, glasses input or voice
        read-back. The platform validates it against the proposal's allowed channels, signs a
        UserConfirmation and forwards it to the capability. Rejected while offline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposal_id, decision, channel, evidence]
              properties:
                proposal_id: { $ref: "../schemas/v1/common.schema.json#/definitions/Ref" }
                decision: { type: string, enum: [confirm, reject] }
                channel: { $ref: "../schemas/v1/common.schema.json#/definitions/ConfirmChannel" }
                evidence: { type: object }
      responses:
        "200":
          description: Outcome from the capability
          content:
            application/json:
              schema: { $ref: "../schemas/v1/action_result.schema.json" }
        "409":
          description: Proposal expired, already decided, or channel not allowed for this proposal
          content:
            application/json:
              schema: { $ref: "../schemas/v1/error_envelope.schema.json" }
        "503":
          description: Offline or capability unavailable; confirmations are never queued
          content:
            application/json:
              schema: { $ref: "../schemas/v1/error_envelope.schema.json" }
  /v1/receipts/verify:
    post:
      summary: Re-check a card's receipt independently (DEC-029)
      description: |
        The client sends a card back exactly as it received it. The platform recomputes the card's
        digest (canonical JSON without `receipt.verification`), checks the ES256 signature over
        {card_id, digest, calc_ids, status, signed_at}, and asks the card's capability to re-match
        every figure against this user's calculation log. Observed figures are matched against the
        user's stored observations. Another user's receipt does not verify against your log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card]
              properties:
                card: { $ref: "../schemas/v1/insight_card.schema.json" }
      responses:
        "200":
          description: The result of the check (a failed check is still a 200)
          content:
            application/json:
              schema:
                type: object
                required: [valid, signature_valid, digest_matches, grounded, unverified]
                properties:
                  valid: { type: boolean, description: "signature_valid && digest_matches && grounded" }
                  signature_valid: { type: boolean }
                  digest_matches: { type: boolean }
                  grounded: { type: boolean, description: Every figure matches a logged calculation or a stored observation }
                  checked_values: { type: integer }
                  unverified: { type: array, items: { type: string } }
                  key_id: { type: string }
                  reason: { type: string, enum: [UNSIGNED, MODIFIED] }
        "400":
          description: No card, or a card without a receipt
          content:
            application/json:
              schema: { $ref: "../schemas/v1/error_envelope.schema.json" }
  /v1/receipts/public-key:
    get:
      summary: The platform's receipt-signing public key
      responses:
        "200":
          description: ES256 public key
          content:
            application/json:
              schema:
                type: object
                required: [key_id, alg, public_key_pem]
                properties:
                  key_id: { type: string }
                  alg: { const: ES256 }
                  public_key_pem: { type: string }
